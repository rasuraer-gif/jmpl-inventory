<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Janani Mouldings Private Limited (JMPL) — IATF 16949 Certified Manufacturer of Moulded Rubber Products, O-Rings, Diaphragms, and Gaskets.">
  <title>Janani Mouldings Pvt. Ltd. | IATF 16949 Certified Company</title>
  
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.sheetjs.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://api.qrserver.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com https://generativelanguage.googleapis.com; frame-src 'self'; object-src 'none';">

  <!-- Preconnect & DNS-prefetch for zero-latency network connection establishment -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>

  <!-- Google Fonts loaded parallel with stylesheets -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

  <link rel="preload" as="image" href="./logo.png">
  <link rel="stylesheet" href="index.css">

  <!-- Firebase SDK Compat (Asynchronous deferred) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js" defer></script>

  <!-- Core -->
  <script src="db.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="scanner.js" defer></script>

  <!-- Modules -->
  <script src="admin.js" defer></script>
  <script src="master.js" defer></script>
  <script src="mould-tracking.js" defer></script>
  <script src="production.js" defer></script>
  <script src="cryogenic.js" defer></script>
  <script src="deflashing.js" defer></script>
  <script src="waiting-trimming.js" defer></script>
  <script src="trimming.js" defer></script>
  <script src="post-curing.js" defer></script>
  <script src="waiting-visual.js" defer></script>
  <script src="print-batch.js" defer></script>
  <script src="visual.js" defer></script>
  <script src="gauge.js" defer></script>
  <script src="quality.js" defer></script>
  <script src="store.js" defer></script>
  <script src="stock.js" defer></script>
  <script src="monthly-plan.js" defer></script>
  <script src="production-schedule.js" defer></script>
  <script src="replenishment.js" defer></script>
  <script src="reports.js" defer></script>
  <script src="daily-analysis.js" defer></script>
  <script src="ai-agent.js" defer></script>
  <script src="task-tracking.js" defer></script>
  <script src="stock-audit.js" defer></script>
  <script src="delivery-challan.js" defer></script>
  
  <!-- App bootstrap (must be last) -->
  <script src="app.js" defer></script>
</head>
<body class="landing-body">
  <!-- Minimal App Root with Instant Zero-Latency Branded Splash -->
  <div id="app-root">
    <div id="_init-splash" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#0f172a; color:#f8fafc; font-family:'Inter',system-ui,sans-serif; text-align:center; padding:20px;">
      <div style="width:84px; height:84px; background:#ffffff; border-radius:18px; padding:8px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,0.3); margin-bottom:16px;">
        <img src="./logo.png" alt="JMPL Logo" style="width:100%; height:100%; object-fit:contain;">
      </div>
      <h1 style="font-size:18px; font-weight:800; margin:0 0 4px; letter-spacing:-0.2px;">
        <span style="color:#22c55e;">Janani Mouldings</span> <span style="color:#f97316;">Private Limited</span>
      </h1>
      <p style="font-size:12px; color:#94a3b8; margin:0 0 20px; font-weight:500;">Inventory Tracking System • IATF 16949</p>
      <div style="width:28px; height:28px; border:3px solid rgba(255,255,255,0.1); border-top-color:#22c55e; border-radius:50%; animation:jmpl-spin 0.8s linear infinite;"></div>
      <style>@keyframes jmpl-spin { to { transform: rotate(360deg); } }</style>
    </div>
  </div>
  
  <div id="toast-container"></div>
</body>
</html>
